[package]
name = "brick-model"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
# Reads back the exported .io archives in the export tests.
zip = { version = "2", default-features = false, features = ["deflate"] }
