  zulip:
    topic_new_event: "🆕"
    topic_edit_event: "📝"
    unauthorized: "You are not authorized to moderate this proposal."
    cmd_approve: "approve"
    cmd_approve_published: "approve published"
    cmd_reject: "reject"
    new_event: "**New Event Proposed**\n**Title:** %{title}\n**Start Date:** %{start_date}\n**End Date:** %{end_date}\n**Location:** %{location}\n**Description:** %{description}\n**Image URL:** %{url}\n\n~~~\n```yaml\n%{payload_str}\n```\n~~~\n\n**Moderation Commands:**\n- Reply `%{cmd_approve}` to publish as draft to Palikkakalenteri.\n- Reply `%{cmd_approve_published}` to publish immediately.\n- Reply `%{cmd_reject}` to discard.\n- Reply with a ```yaml``` block containing only the fields you want to change to update the payload.\n- Any other reply will be sent as a message to the user."
    new_event_no_image: "**New Event Proposed**\n**Title:** %{title}\n**Start Date:** %{start_date}\n**End Date:** %{end_date}\n**Location:** %{location}\n**Description:** %{description}\n\n~~~\n```yaml\n%{payload_str}\n```\n~~~\n\n**Moderation Commands:**\n- Reply `%{cmd_approve}` to publish as draft to Palikkakalenteri.\n- Reply `%{cmd_approve_published}` to publish immediately.\n- Reply `%{cmd_reject}` to discard.\n- Reply with a ```yaml``` block containing only the fields you want to change to update the payload.\n- Any other reply will be sent as a message to the user."
    edit_event: "**Event Edit Proposed**\n**Title:** %{title}\n**Start Date:** %{start_date}\n**End Date:** %{end_date}\n**Location:** %{location}\n**Description:** %{description}\n\n```diff\n%{payload_str}\n```\n\n~~~\n```yaml\n%{yaml_str}\n```\n~~~\n\n**Moderation Commands:**\n- Reply `%{cmd_approve}` to apply these changes to Palikkakalenteri.\n- Reply `%{cmd_reject}` to discard.\n- Reply with a ```yaml``` block containing only the fields you want to change to update the payload.\n- Any other reply will be sent as a message to the user."
    topic_new_location: "📍"
    topic_edit_location: "📌"
    new_location: "**New Location Proposed**\n**Title:** %{title}\n**Address:** %{location}\n**Opening hours:** %{opening_hours}\n**Description:** %{description}\n**Image URL:** %{url}\n\n~~~\n```yaml\n%{payload_str}\n```\n~~~\n\n**Moderation Commands:**\n- Set `point` (`lat` / `lon`) with a ```yaml``` block before approving — a location cannot be published without coordinates.\n- Reply `%{cmd_approve}` to publish as draft to Palikkakartta.\n- Reply `%{cmd_approve_published}` to publish immediately.\n- Reply `%{cmd_reject}` to discard.\n- Reply with a ```yaml``` block containing only the fields you want to change to update the payload.\n- Any other reply will be sent as a message to the user."
    new_location_no_image: "**New Location Proposed**\n**Title:** %{title}\n**Address:** %{location}\n**Opening hours:** %{opening_hours}\n**Description:** %{description}\n\n~~~\n```yaml\n%{payload_str}\n```\n~~~\n\n**Moderation Commands:**\n- Set `point` (`lat` / `lon`) with a ```yaml``` block before approving — a location cannot be published without coordinates.\n- Reply `%{cmd_approve}` to publish as draft to Palikkakartta.\n- Reply `%{cmd_approve_published}` to publish immediately.\n- Reply `%{cmd_reject}` to discard.\n- Reply with a ```yaml``` block containing only the fields you want to change to update the payload.\n- Any other reply will be sent as a message to the user."
    edit_location: "**Location Edit Proposed**\n**Title:** %{title}\n**Address:** %{location}\n**Opening hours:** %{opening_hours}\n**Description:** %{description}\n\n```diff\n%{payload_str}\n```\n\n~~~\n```yaml\n%{yaml_str}\n```\n~~~\n\n**Moderation Commands:**\n- Reply `%{cmd_approve}` to apply these changes to Palikkakartta.\n- Reply `%{cmd_reject}` to discard.\n- Reply with a ```yaml``` block containing only the fields you want to change to update the payload.\n- Any other reply will be sent as a message to the user."
    missing_point: "This location has no coordinates yet, so it cannot be published. Reply with a ```yaml``` block setting `point`, for example:\n\n~~~\n```yaml\npoint:\n  lat: 60.1699\n  lon: 24.9384\n```\n~~~"
