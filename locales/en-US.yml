    adjusted_snapped: "Nudged %{count} part(s) onto the stud grid."
    adjusted_settled_down: "Dropped %{count} part(s) %{plates} plate(s) onto what's below."
    adjusted_settled_up: "Lifted %{count} part(s) %{plates} plate(s) so nothing overlaps."
    # Placement proposals: naming a part without saying where it goes.
    propose_what: "%{count} × %{colour} %{part} — where should it go?"
    propose_what_drawing: "That drawing is %{count} part(s) — where should it go?"
